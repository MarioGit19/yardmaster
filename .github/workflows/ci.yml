name: CI

on:
  push:
    branches: [main]
    # Docs-only pushes don't need a run.
    paths-ignore: ["**.md", "docs/**", "loop/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes count 10x on private repos, so it runs there only when started by hand.
        # Once the repo is public (free minutes), every run covers both.
        os: ${{ fromJSON((github.event.repository.private && github.event_name != 'workflow_dispatch') && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: node apps/server/dist/cli.js doctor

      - name: Package the extension
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter yardmaster-extension package

      - name: Upload extension package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: yardmaster-extension
          path: apps/extension/dist/*.vsix
          if-no-files-found: error
