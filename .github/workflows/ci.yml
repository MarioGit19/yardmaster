name: CI

on:
  push:
    branches: [main]
    # Docs-only pushes don't need a run.
    paths-ignore: ["**.md", "docs/**", "loop/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes count 10x on private repos, so it runs there only when started by hand.
        # Once the repo is public (free minutes), every run covers both.
        os: ${{ fromJSON((github.event.repository.private && github.event_name != 'workflow_dispatch') && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: node apps/server/dist/cli.js doctor

      - name: Package the extension
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter yardmaster-extension package

      - name: Upload extension package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yardmaster-extension
          path: apps/extension/dist/*.vsix
          if-no-files-found: error
